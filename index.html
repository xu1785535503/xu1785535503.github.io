<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#ffeef8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>表白网站</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(145deg, #ffeef8 0%, #e8f4ff 45%, #fff5f0 100%);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      color: #c2185b;
      font-weight: 600;
      margin-bottom: clamp(24px, 8vw, 48px);
      text-align: center;
      font-size: clamp(1.35rem, 5.5vw, 2rem);
      line-height: 1.35;
      padding: 0 8px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .btn-row {
      position: relative;
      width: min(560px, 100%);
      flex-shrink: 0;
      height: min(320px, 42vh);
      height: min(320px, 42dvh);
      margin-top: 8px;
      touch-action: manipulation;
    }

    button {
      position: absolute;
      padding: 14px 36px;
      font-size: 18px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      touch-action: manipulation;
      min-height: 44px;
      min-width: 44px;
    }

    @media (max-width: 520px) {
      .btn-row {
        height: min(400px, 56dvh);
      }

      button {
        padding: 16px 40px;
        font-size: 17px;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      #reject:hover {
        border-color: #ddd;
      }

      #agree:hover {
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      }
    }

    #agreeWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      transition: left 0.28s ease-out, top 0.28s ease-out;
    }

    #agree {
      position: relative;
      left: auto;
      top: auto;
      transform-origin: center center;
      background: linear-gradient(180deg, #ff6b9d, #e91e63);
      color: #fff;
      animation: agreePulse 3s ease-in-out infinite alternate;
    }

    #agree:hover {
      box-shadow: 0 6px 24px rgba(233, 30, 99, 0.45);
    }

    #agree:active {
      filter: brightness(0.92);
    }

    @keyframes agreePulse {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.35);
      }
    }

    @media (max-width: 520px) {
      #agree {
        animation-name: agreePulseMobile;
        animation-duration: 3.2s;
      }

      @keyframes agreePulseMobile {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.28);
        }
      }
    }

    #reject {
      left: 15%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      color: #666;
      border: 2px solid #ddd;
      z-index: 3;
      transition: left 0.25s ease-out, top 0.25s ease-out, transform 0.25s ease-out;
    }

    #reject:hover {
      border-color: #bbb;
    }

    body.end-page {
      justify-content: flex-start;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(
        165deg,
        #e8f5e9 0%,
        #fff8e7 40%,
        #fce4ec 100%
      );
    }

    body.end-page .end-wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 32px;
    }

    body.end-page .ascii-art {
      display: block;
      margin: 0 auto;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono",
        Menlo, "Courier New", monospace;
      font-size: clamp(12px, 3.4vw, 17px);
      line-height: 1.4;
      letter-spacing: 0.02em;
      color: #1b4332;
      text-align: left;
      white-space: pre;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    body.end-page .end-caption {
      margin-top: 28px;
      font-size: clamp(1.05rem, 4vw, 1.35rem);
      font-weight: 600;
      color: #ad1457;
      line-height: 1.5;
      padding: 0 8px;
      text-align: center;
      width: 100%;
    }

    body.end-page .end-sub {
      margin-top: 10px;
      font-size: clamp(0.9rem, 3.5vw, 1rem);
      color: #5d4037;
      opacity: 0.9;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>愿意和我在一起吗？</h1>
  <div class="btn-row" id="stage">
    <div id="agreeWrap">
      <button type="button" id="agree">同意 ❤</button>
    </div>
    <button type="button" id="reject">拒绝</button>
  </div>
  <script>
    (function () {
      var agree = document.getElementById("agree");
      var agreeWrap = document.getElementById("agreeWrap");
      var reject = document.getElementById("reject");
      var stage = document.getElementById("stage");

      var rejectScale = 1;
      var minScale = 0.35;

      function randomInRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function moveRejectAway() {
        var rect = stage.getBoundingClientRect();
        var rr = reject.getBoundingClientRect();
        var cx = rr.left + rr.width / 2 - rect.left;
        var cy = rr.top + rr.height / 2 - rect.top;

        agreeWrap.style.left = cx + "px";
        agreeWrap.style.top = cy + "px";
        agreeWrap.style.transform = "translate(-50%, -50%)";

        var scaledW = reject.offsetWidth * rejectScale;
        var scaledH = reject.offsetHeight * rejectScale;
        var pad = 10;

        var leftPx =
          pad +
          randomInRange(0, Math.max(0, rect.width - scaledW - pad * 2));
        var topPx =
          pad +
          randomInRange(0, Math.max(0, rect.height - scaledH - pad * 2));

        reject.style.left = leftPx + "px";
        reject.style.top = topPx + "px";
        reject.style.transform = "translate(0, 0) scale(" + rejectScale + ")";

        rejectScale = Math.max(minScale, rejectScale - 0.12);
      }

      var suppressRejectClick = false;

      reject.addEventListener("mouseenter", moveRejectAway);
      reject.addEventListener(
        "touchstart",
        function (e) {
          suppressRejectClick = true;
          window.setTimeout(function () {
            suppressRejectClick = false;
          }, 450);
          e.preventDefault();
          moveRejectAway();
        },
        { passive: false }
      );

      reject.addEventListener("click", function (e) {
        e.preventDefault();
        if (suppressRejectClick) return;
        moveRejectAway();
      });

      function onAgree() {
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute("content", "#e8f5e9");

        document.title = "白菜已被拱走～";

        var art =
          "\n" +
          "              🥬\n" +
          "         ╭────┴────╮\n" +
          "         │水灵灵大白菜│\n" +
          "         ╰────┬────╯\n" +
          "              │\n" +
          "   ≋≋≋≋≋≋≋≋≋≋≋┼≋≋≋≋≋≋≋≋≋≋≋\n" +
          "            🐷 哼哼拱～～\n" +
          "           ╱( ◕ᴗ◕ )╲\n" +
          "           ╲  ∪∪  ╱\n" +
          "            ─────\n" +
          "              ‖\n" +
          "           ≋猪蹄印≋≋≋\n";

        document.body.className = "end-page";
        document.body.innerHTML =
          '<div class="end-wrap">' +
          '<pre class="ascii-art" role="img" aria-label="符号画：白菜在上，小猪从下方拱上去">' +
          art.replace(/&/g, "&amp;").replace(/</g, "&lt;") +
          "</pre>" +
          '<p class="end-caption">太好啦！这颗白菜自愿被这只猪拱走啦～</p>' +
          '<p class="end-sub">（达成成就：好白菜 × 猪猪 √）</p>' +
          "</div>";
      }

      agree.addEventListener("click", onAgree);
    })();
  </script>
</body>
</html>
